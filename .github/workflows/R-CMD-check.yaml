# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true  # Use RSPM for faster package installs

      - uses: r-lib/actions/setup-pandoc@v2  # Critical if you have vignettes

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: rcmdcheck
          needs: check

      - name: Check package
        run: |
          options(install.packages.check.source = "no")
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--compact-vignettes=gs+qpdf"),
            error_on = "warning",  # Treat warnings as errors
            check_dir = "check"
          )
        shell: Rscript {0}
